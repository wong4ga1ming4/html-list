services:
  html-list:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - MAX_UPLOAD_MB=20
    restart: unless-stopped
    healthcheck:
      # bookworm-slim 没有 wget；node 22 自带 fetch，零新增依赖
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
